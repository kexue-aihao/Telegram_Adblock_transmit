name: Build and publish Docker image

on:
  push:
    branches: [master]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kexue-aihao/telegram-adblock-transmit

# A newer run for the same branch makes older, queued image builds irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Jobs grant additional permissions only where they are needed.
permissions:
  contents: read

jobs:
  test:
    name: Test Go code
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_DB: telegram_adblock_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: integration-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d telegram_adblock_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test install and upgrade script
        run: |
          bash -n scripts/deploy.sh
          python3 scripts/test_deploy.py -v
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.x'
          cache: true
      - name: Verify dependency checksums
        run: go mod verify
      - name: Run tests
        run: go test ./...
      - name: Run race detector
        run: go test -race ./...
      - name: Verify repository integration with PostgreSQL
        env:
          TEST_DATABASE_URL: postgres://postgres:integration-only-password@localhost:5432/telegram_adblock_ci?sslmode=disable
        run: go test -race ./internal/store -run '^(TestBuiltinSettingsRepositoryIntegration|TestBotSettingsRepositoryIntegration|TestPanelAuditBuiltinHitsIntegration|TestAuditDistinctMessagesIntegration)$' -count=1 -v
      - name: Run vet
        run: go vet ./...
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Scan source dependencies and filesystem
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

  verify-image:
    name: Verify Docker image build
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: telegram-adblock-transmit:pr-${{ github.event.pull_request.number }}

  publish:
    name: Publish Docker image with provenance and SBOM
    needs: test
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and publish image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest published image provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release:
    name: Publish the GitHub release for the tag
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Check out source with tags
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # The one-click deployment script resolves the newest version through
      # /releases/latest, which only reflects published releases. Publishing one
      # here keeps "push the tag" and "release" the same action, so a tag can no
      # longer ship an image without a release page. The annotated tag message
      # becomes the title and .github/release-notes/<tag>.md becomes the body.
      - name: Create the release when it is missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists; leaving it untouched"
            exit 0
          fi
          title="$(git tag -l --format='%(contents:subject)' "$tag")"
          notes_file=".github/release-notes/${tag}.md"
          if [[ -f "$notes_file" ]]; then
            # A leading markdown heading becomes the release title, so the tag
            # annotation can stay in the repository's English tag style while
            # the release list keeps its Chinese titles.
            if [[ "$(head -n 1 "$notes_file")" == "# "* ]]; then
              title="$(head -n 1 "$notes_file")"
              title="${title#\# }"
              notes_file="$(mktemp)"
              tail -n +2 ".github/release-notes/${tag}.md" | sed '/./,$!d' > "$notes_file"
            fi
            gh release create "$tag" --verify-tag --title "${title:-$tag}" --notes-file "$notes_file"
          else
            body="$(git tag -l --format='%(contents:body)' "$tag")"
            gh release create "$tag" --verify-tag --title "${title:-$tag}" --notes "${body:-$title}"
          fi
