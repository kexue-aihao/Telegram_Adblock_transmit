<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f3f6f5">
<title>广告拦截管理面板</title>
<script src="/assets/theme.js"></script>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<a class="skip-link" href="#view">跳到主要内容</a>
<header class="topbar">
  <a class="brand" href="#/dashboard" aria-label="广告拦截管理面板首页">
    <svg class="brand-mark" aria-hidden="true"><use href="/assets/icons.svg#shield-check"/></svg>
    <span>广告拦截<span class="brand-sub">管理控制台</span></span>
  </a>
  <div class="topbar-actions">
    <span id="account-name" class="account-name"></span>
    <button id="theme-toggle" class="icon-btn" type="button" title="切换主题" aria-label="切换主题">
      <svg class="icon theme-sun" aria-hidden="true"><use href="/assets/icons.svg#sun"/></svg>
      <svg class="icon theme-moon" aria-hidden="true"><use href="/assets/icons.svg#moon"/></svg>
    </button>
    <button id="logout-btn" class="icon-btn" type="button" title="退出登录" aria-label="退出登录" hidden>
      <svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#log-out"/></svg>
    </button>
  </div>
</header>
<div class="layout">
  <aside class="sidebar" id="sidebar" hidden>
    <nav class="nav" aria-label="主导航">
      <span class="nav-indicator" aria-hidden="true"></span>
      <a href="#/dashboard" class="nav-item" data-route="dashboard"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#layout-dashboard"/></svg><span>仪表盘</span></a>
      <a href="#/rules" class="nav-item" data-route="rules"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#list-filter"/></svg><span>规则管理</span></a>
      <a href="#/audit" class="nav-item" data-route="audit"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#scroll-text"/></svg><span>审计日志</span></a>
      <a href="#/settings" class="nav-item" data-route="settings"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#settings"/></svg><span>设置</span></a>
    </nav>
    <div class="sidebar-note"><span class="sidebar-caption">专注社区，守护交流</span><span>Telegram Moderation</span></div>
  </aside>
  <main id="view" class="view" tabindex="-1"></main>
</div>
<div id="modal-root"></div>
<div id="toast-region" class="toast-region" role="status" aria-live="polite" aria-relevant="additions"></div>
<script src="/assets/motion.js"></script>
<script src="/assets/app.js"></script>
</body>
</html>
