services:
  bot:
    image: ${BOT_IMAGE:-ghcr.io/kexue-aihao/telegram-adblock-transmit:latest}
    build: .
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: "0.50"
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?set BOT_TOKEN in .env}
      TELEGRAM_API_ENDPOINT: ${TELEGRAM_API_ENDPOINT:-https://api.telegram.org/bot%s/%s}
      TELEGRAM_ALLOW_INSECURE_HTTP: ${TELEGRAM_ALLOW_INSECURE_HTTP:-false}
      TELEGRAM_HTTP_TIMEOUT: ${TELEGRAM_HTTP_TIMEOUT:-30s}
      DATABASE_URL: postgres://telegram_bot:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/telegram_adblock?sslmode=disable
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ADFILTER_ENABLED: ${ADFILTER_ENABLED:-true}
      BIO_CHECK_ENABLED: ${BIO_CHECK_ENABLED:-false}
      # Web 管理面板（可选）。WEBUI_ADDR 留空则禁用；启用时需同时设置用户名和密码。
      WEBUI_ADDR: ${WEBUI_ADDR:-}
      WEBUI_USERNAME: ${WEBUI_USERNAME:-}
      WEBUI_PASSWORD: ${WEBUI_PASSWORD:-}
      WEBUI_SESSION_SECRET: ${WEBUI_SESSION_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 20s
    # 可选：仅绑定宿主机回环地址暴露面板（不推荐，建议用 1Panel 反向代理走 HTTPS）：
    # ports:
    #   - "127.0.0.1:8080:8080"

  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    pids_limit: 256
    mem_limit: 512m
    cpus: "1.00"
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: telegram_adblock
      POSTGRES_USER: telegram_bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telegram_bot -d telegram_adblock"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
